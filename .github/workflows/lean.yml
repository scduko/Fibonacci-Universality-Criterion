name: Lean

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'paper/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'paper/**']
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run per pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore pinned Lean dependencies
        id: lean-deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-dependencies
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Prepare Lean dependencies
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: ${{ steps.lean-deps.outputs.cache-matched-key == '' }}
      - name: Save new dependency cache
        if: steps.lean-deps.outputs.cache-matched-key == ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: ${{ steps.lean-deps.outputs.cache-primary-key }}
      - name: Restore project build cache
        id: project-build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake/build
          key: project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', 'FibonacciCriterion.lean', 'FibonacciCriterion/**/*.lean') }}
          restore-keys: |
            project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Remove restored outputs of deleted modules
        run: |
          # A prefix-matched cache can restore outputs of modules that no longer
          # exist, and leanchecker replays every module under the package prefix.
          if [ -d .lake/build ]; then
            find .lake/build -type f -path '*/FibonacciCriterion/*' | while read -r f; do
              rel="${f#*/FibonacciCriterion/}"
              mod="${rel%%.*}"
              if [ ! -f "FibonacciCriterion/$mod.lean" ]; then
                echo "removing stale $f"
                rm -f "$f"
              fi
            done
          fi
      # The four checks of docs/STATUS.md. The action runs them in this order:
      # lake build, lake lint, leanchecker, axiom-audit.
      - name: Build, lint, replay, and audit Lean proofs
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          build: "true"
          test: "false"
          lint: "true"
          use-mathlib-cache: "false"
          use-github-cache: "false"
          leanchecker: "true"
          leanchecker-args: "-v FibonacciCriterion"
          axiom-audit: "true"
          axiom-audit-root: "FibonacciCriterion"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
      # Saved after the complete build, so later runs rebuild only the modules
      # that changed. Pull requests can restore the cache saved on main.
      - name: Save project build cache
        if: steps.project-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake/build
          key: ${{ steps.project-build-cache.outputs.cache-primary-key }}
