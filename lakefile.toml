rev = "ecf223a7903220802e579605a8c6aa671363a668"

[[lean_lib]]
name = "FibonacciCriterion"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "0535b3bf5a083a09c92f18f3f8aa2017f32a803c"
